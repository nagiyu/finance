name: Deploy

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      deploy_cloudformation:
        description: 'Deploy CloudFormation stacks'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy-cloudformation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_cloudformation == 'true' }}

    permissions:
      contents: read

    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AWS CLI install
        run: |
          cd /tmp
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: AWS set Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Secrets from AWS SecretsManager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            AWS_SECRETS, AWS
          parse-json-secrets: true

      - name: Get Project Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            PROJECT, ${{ github.ref == 'refs/heads/master' && 'Finance' || 'DevFinance' }}
          parse-json-secrets: true

      - name: Package CloudFormation templates (if needed)
        run: |
          if [ -d "infra/cloudformation" ]; then
            echo "Packaging CloudFormation templates..."
            shopt -s nullglob
            for template in infra/cloudformation/*.yml; do
              echo "Validating $template..."
              aws cloudformation validate-template --template-body file://$template
            done
            shopt -u nullglob
          else
            echo "No infra/cloudformation directory found, skipping packaging."
          fi

      - name: Deploy CloudFormation stacks
        run: |
          STACK_PREFIX="${{ github.ref == 'refs/heads/master' && 'finance-prod' || 'finance-dev' }}"
          
          if [ -d "infra/cloudformation" ]; then
            # Deploy base stack if exists
            if [ -f "infra/cloudformation/base-stack.yml" ]; then
              echo "Deploying base-stack..."
              aws cloudformation deploy \
                --template-file infra/cloudformation/base-stack.yml \
                --stack-name "${STACK_PREFIX}-base" \
                --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
                --no-fail-on-empty-changeset \
                --parameter-overrides \
                  Environment="${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}" \
                || echo "base-stack deployment completed or no changes"
            fi
            
            # Deploy other stacks in infra/cloudformation directory
            shopt -s nullglob
            for template in infra/cloudformation/*.yml; do
              if [ "$(basename $template)" != "base-stack.yml" ]; then
                STACK_NAME="${STACK_PREFIX}-$(basename $template .yml)"
                echo "Deploying $STACK_NAME from $template..."
                aws cloudformation deploy \
                  --template-file "$template" \
                  --stack-name "$STACK_NAME" \
                  --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
                  --no-fail-on-empty-changeset \
                  --parameter-overrides \
                    Environment="${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}" \
                || echo "$STACK_NAME deployment completed or no changes"
              fi
            done
            shopt -u nullglob
          else
            echo "No infra/cloudformation directory found, skipping CloudFormation deployment."
            echo "Create infra/cloudformation/base-stack.yml to enable CloudFormation deployment."
          fi

  deploy-client-finance:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: AWS CLI install
      run: |
        cd /tmp
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update

    - name: AWS set Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get Secrets from AWS SecretsManager
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret-ids: |
          AWS_SECRETS, AWS
        parse-json-secrets: true

    - name: Get Secrets from Google AdSense
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret-ids: |
          GOOGLE_ADSENSE, GoogleAdSense
        parse-json-secrets: true

    - name: Get Project Secrets from Finance
      if: ${{ startsWith(github.ref, 'refs/heads/master') }}
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret-ids: |
          PROJECT, Finance
        parse-json-secrets: true

    - name: Get Project Secrets from DevFinance
      if: ${{ !startsWith(github.ref, 'refs/heads/master') }}
      uses: aws-actions/aws-secretsmanager-get-secrets@v2
      with:
        secret-ids: |
          PROJECT, DevFinance
        parse-json-secrets: true

    - name: Rewrite sw.js endpoint from secrets
      run: |
        sed -i 's|http://localhost:3000|${{ env.PROJECT_CLIENT_BASE_URL }}|g' client/finance/public/sw.js

    - name: Rewrite ads.txt content from secrets
      run: |
        sed -i 's|{{ PublisherID }}|${{ env.GOOGLE_ADSENSE_PUBLISHER_ID }}|g' client/finance/public/ads.txt

    - name: Deploy
      run: |
        aws ecr get-login-password --region ${{ env.AWS_SECRETS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com
        docker build \
          --build-arg PROCESS_ENV=${{ github.ref == 'refs/heads/master' && 'production' || 'development' }} \
          --build-arg PROJECT_SECRET=${{ github.ref == 'refs/heads/master' && 'Finance' || 'DevFinance' }} \
          --build-arg PROJECT_AWS_ACCESS_KEY=${{ env.PROJECT_AWS_ACCESS_KEY }} \
          --build-arg PROJECT_AWS_SECRET_ACCESS_KEY=${{ env.PROJECT_AWS_SECRET_ACCESS_KEY }} \
          --build-arg PROJECT_AWS_REGION=${{ env.PROJECT_AWS_REGION }} \
          --build-arg NEXTAUTH_URL=${{ env.PROJECT_CLIENT_BASE_URL }} \
          -f client/finance/Dockerfile \
          -t ${{ env.PROJECT_CLIENT_PROJECT_NAME }} .
        docker tag ${{ env.PROJECT_CLIENT_PROJECT_NAME }}:latest ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com/${{ env.PROJECT_CLIENT_PROJECT_NAME }}:latest
        docker push ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com/${{ env.PROJECT_CLIENT_PROJECT_NAME }}:latest

    - name: Update Lambda Function
      run: |
        aws lambda update-function-code --function-name ${{ env.PROJECT_CLIENT_PROJECT_NAME }} --image-uri ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com/${{ env.PROJECT_CLIENT_PROJECT_NAME }}:latest

  deploy-server-finance:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: AWS CLI install
        run: |
          cd /tmp
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: AWS set Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Secrets from AWS SecretsManager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            AWS_SECRETS, AWS
          parse-json-secrets: true

      - name: Get Project Secrets from Finance
        if: ${{ startsWith(github.ref, 'refs/heads/master') }}
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            PROJECT, Finance
          parse-json-secrets: true

      - name: Get Project Secrets from DevFinance
        if: ${{ !startsWith(github.ref, 'refs/heads/master') }}
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            PROJECT, DevFinance
          parse-json-secrets: true

      - name: Deploy
        run: |
          aws ecr get-login-password --region ${{ env.AWS_SECRETS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com
          docker build \
            --build-arg PROCESS_ENV=${{ github.ref == 'refs/heads/master' && 'production' || 'development' }} \
            --build-arg PROJECT_SECRET=${{ github.ref == 'refs/heads/master' && 'Finance' || 'DevFinance' }} \
            --build-arg PROJECT_AWS_ACCESS_KEY=${{ env.PROJECT_AWS_ACCESS_KEY }} \
            --build-arg PROJECT_AWS_SECRET_ACCESS_KEY=${{ env.PROJECT_AWS_SECRET_ACCESS_KEY }} \
            --build-arg PROJECT_AWS_REGION=${{ env.PROJECT_AWS_REGION }} \
            -f server/finance/Dockerfile \
            -t ${{ env.PROJECT_SERVER_PROJECT_NAME }} .
          docker tag ${{ env.PROJECT_SERVER_PROJECT_NAME }}:latest ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com/${{ env.PROJECT_SERVER_PROJECT_NAME }}:latest
          docker push ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com/${{ env.PROJECT_SERVER_PROJECT_NAME }}:latest

      - name: Update Lambda Function
        run: |
          aws lambda update-function-code --function-name ${{ env.PROJECT_SERVER_PROJECT_NAME }} --image-uri ${{ env.AWS_SECRETS_REPOSITORY_ID }}.dkr.ecr.${{ env.AWS_SECRETS_REGION }}.amazonaws.com/${{ env.PROJECT_SERVER_PROJECT_NAME }}:latest
