name: CI - Root

on:
  push:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Root-level checks
  root-lint:
    name: Root Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

  root-format-check:
    name: Root Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check

  # Finance core module checks
  finance-lint:
    name: Finance Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            typescript-common/common/package-lock.json
            finance/package-lock.json

      - name: Install dependencies for typescript-common
        run: |
          cd typescript-common/common
          npm install

      - name: Install dependencies for finance
        run: |
          cd finance
          npm install

      - name: Run lint
        run: |
          cd finance
          npm run lint

  finance-typecheck:
    name: Finance Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            typescript-common/common/package-lock.json
            finance/package-lock.json

      - name: Install dependencies for typescript-common
        run: |
          cd typescript-common/common
          npm install

      - name: Install dependencies for finance
        run: |
          cd finance
          npm install

      - name: Run typecheck
        run: |
          cd finance
          npm run typecheck

  finance-test:
    name: Finance Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            typescript-common/common/package-lock.json
            finance/package-lock.json

      - name: Install dependencies for typescript-common
        run: |
          cd typescript-common/common
          npm install

      - name: Install dependencies for finance
        run: |
          cd finance
          npm install

      - name: Run tests
        run: |
          cd finance
          npm test
