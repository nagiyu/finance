name: Unit Tests

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  test-finance:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Update Submodules
      run: |
        git submodule update --init --recursive
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          typescript-common/package-lock.json
          finance/package-lock.json
    
    - name: Install dependencies for typescript-common
      run: |
        cd typescript-common
        npm install
    
    - name: Install dependencies for finance
      run: |
        cd finance
        npm install
    
    - name: Run unit tests for finance
      run: |
        cd finance
        npm test
        echo "✅ Finance module unit tests completed successfully"