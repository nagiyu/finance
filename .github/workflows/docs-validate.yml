name: Docs Validate

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'docs/**'
      - 'specs/**'
      - 'scripts/validate-docs.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm install

    - name: Lint documentation with remark
      run: npm run docs:lint

    - name: Validate documentation schema with ajv
      run: npm run docs:validate
