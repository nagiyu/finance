name: CI - Client

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'client/finance/**'
      - 'nextjs-common/**'
      - '.github/workflows/ci-client.yml'
  push:
    branches:
      - master
      - develop
    paths:
      - 'client/finance/**'
      - 'nextjs-common/**'
      - '.github/workflows/ci-client.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/finance/package-lock.json

      - name: Install dependencies for nextjs-common
        run: |
          cd nextjs-common/common
          npm install

      - name: Install dependencies for client/finance
        run: |
          cd client/finance
          npm install

      - name: Run lint
        run: |
          cd client/finance
          npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/finance/package-lock.json

      - name: Install dependencies for nextjs-common
        run: |
          cd nextjs-common/common
          npm install

      - name: Install dependencies for client/finance
        run: |
          cd client/finance
          npm install

      - name: Run typecheck
        run: |
          cd client/finance
          npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/finance/package-lock.json

      - name: Install dependencies for nextjs-common
        run: |
          cd nextjs-common/common
          npm install

      - name: Install dependencies for client/finance
        run: |
          cd client/finance
          npm install

      - name: Run tests
        run: |
          cd client/finance
          npm test
