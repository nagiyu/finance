AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Base stack for Finance application infrastructure.
  Provides IAM Roles and Outputs to be extended by other templates.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (development or production)
    Default: development
    AllowedValues:
      - development
      - production

Resources:
  # IAM Roles
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Name
          Value: !Sub finance-${Environment}-lambda-execution-role
        - Key: Environment
          Value: !Ref Environment

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub finance-${Environment}-ecs-task-execution-role
        - Key: Environment
          Value: !Ref Environment

Outputs:
  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub finance-${Environment}-lambda-execution-role-arn

  ECSTaskExecutionRoleArn:
    Description: ARN of the ECS task execution role
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub finance-${Environment}-ecs-task-execution-role-arn

  Environment:
    Description: Deployment environment
    Value: !Ref Environment
    Export:
      Name: !Sub finance-${Environment}-environment
